[tool.poetry]
name = "pysquril"
version = "1.2.1"
description = "Python implementation of structured URI query language"
readme = "README.md"
repository = "https://github.com/unioslo/pysquril"
authors = [
    "Leon du Toit <l.c.d.toit@usit.uio.no>",
    "Eirik Haatveit <haatveit@uio.no>",
]

[tool.poetry.dependencies]
python = ">=3.9"
psycopg2 = ">=2.9.3"
# Async dependencies (optional)
aiosqlite = {version = ">=0.19.0", optional = true}
psycopg = {version = ">=3.1.0", optional = true, extras = ["pool"]}

[tool.poetry.extras]
async = ["aiosqlite", "psycopg"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.1.2"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.0.0"
pytest-postgresql = ">=6.0.0"
ruff = ">=0.15.13"
termcolor = ">=1.1.0"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
